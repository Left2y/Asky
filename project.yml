name: Asky
options:
  bundleIdPrefix: app.kulahere
  deploymentTarget:
    macOS: "26.0"
  createIntermediateGroups: true
  developmentLanguage: zh-Hans
settings:
  base:
    SWIFT_VERSION: "6.0"
    MACOSX_DEPLOYMENT_TARGET: "26.0"
    DEAD_CODE_STRIPPING: YES
packages:
  MarkdownUI:
    url: https://github.com/gonzalezreal/swift-markdown-ui
    exactVersion: 2.4.1
  KulaCore:
    path: Packages/KulaCore
targets:
  Asky:
    type: application
    platform: macOS
    sources:
      - path: App/Sources
      - path: App/Assets.xcassets
      - path: App/Resources
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Asky
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
        LSUIElement: true
        LSMinimumSystemVersion: "26.0"
        NSHumanReadableCopyright: ""
        NSCalendarsFullAccessUsageDescription: Asky 在你明确要求时读取或创建日历事件，并用于冲突检查。
        NSRemindersFullAccessUsageDescription: Asky 在你明确要求时读取或创建提醒事项。
        NSContactsUsageDescription: Asky 用于在你发起的任务中确认联系人。
        NSAppleEventsUsageDescription: Asky 用于列出与切换 Chrome 标签、在授权的备忘录文件夹中搜索与追加内容。
        # Dev builds locate AgentRuntime/dist next to the sources; release builds bundle it under Resources.
        KHSourceRoot: $(SRCROOT)
    entitlements:
      path: App/Asky.entitlements
      properties:
        com.apple.security.automation.apple-events: true
        com.apple.security.personal-information.calendars: true
        com.apple.security.personal-information.addressbook: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.kulahere.KulaHere
        PRODUCT_NAME: Asky
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_HARDENED_RUNTIME: YES
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: "-"
        GENERATE_INFOPLIST_FILE: NO
        SWIFT_STRICT_CONCURRENCY: complete
    postBuildScripts:
      - name: Preserve legacy MCP command path
        script: |
          ln -sf asky-mcp "$TARGET_BUILD_DIR/$EXECUTABLE_FOLDER_PATH/kulahere-mcp"
        basedOnDependencyAnalysis: false
    dependencies:
      - package: MarkdownUI
      - package: KulaCore
        products: [Contracts, Theme, Router, DirectActions, Resources, LocalStore, ToolService,
                   AgentHost, Memory, Scheduler, Search, Adapters, MCPLink, MCPGateway]
      - target: asky-mcp
        copy:
          destination: executables
        link: false

  asky-mcp:
    type: tool
    platform: macOS
    sources:
      - path: MCPBridge/Sources/asky-mcp
    settings:
      base:
        PRODUCT_NAME: asky-mcp
        ENABLE_HARDENED_RUNTIME: YES
        CODE_SIGN_IDENTITY: "-"
        SKIP_INSTALL: YES
    dependencies:
      - package: KulaCore
        products: [MCPLink, Contracts]

schemes:
  Asky:
    build:
      targets:
        Asky: all
        asky-mcp: all
    run:
      config: Debug
    archive:
      config: Release
