name: Alma development app

on:
  workflow_dispatch:
  push:
    branches: [feat/alma-native-chat]

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 15
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
    steps:
      - uses: actions/checkout@v4
      - name: Verify SDK and Swift tools
        run: |
          xcodebuild -version
          xcrun --sdk macosx --show-sdk-version
          xcrun swift --version
          xcrun swift package --package-path Packages/KulaCore dump-package > /dev/null
      - name: Install XcodeGen
        run: command -v xcodegen || brew install xcodegen
      - name: Use SDK 26 compatible app icon
        run: |
          python3 - <<'PY'
          from pathlib import Path
          project = Path("project.yml")
          text = project.read_text()
          text = text.replace("      - path: App/Branding/AskyNative.icon\n        type: file\n        buildPhase: resources\n", "")
          text = text.replace("ASSETCATALOG_COMPILER_APPICON_NAME: AskyNative", "ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon")
          project.write_text(text)
          PY
      - name: Generate project
        run: xcodegen generate
      - name: Isolate development app
        run: |
          /usr/libexec/PlistBuddy -c 'Add :KHIsolatedDevelopment bool true' App/Info.plist
          /usr/libexec/PlistBuddy -c 'Set :CFBundleDisplayName Asky-Alma' App/Info.plist
      - name: Build native app
        timeout-minutes: 8
        run: >-
          xcodebuild -project Asky.xcodeproj -scheme Asky -configuration Debug
          -destination 'platform=macOS,arch=arm64' -derivedDataPath build
          PRODUCT_BUNDLE_IDENTIFIER=app.left2y.asky-alma CODE_SIGNING_ALLOWED=NO
      - name: Archive build
        run: ditto -c -k --sequesterRsrc --keepParent build/Build/Products/Debug/Asky.app Asky-Alma-native.zip
      - uses: actions/upload-artifact@v4
        with:
          name: Asky-Alma-native
          path: Asky-Alma-native.zip
          retention-days: 7
      - name: Isolated native chat tests
        timeout-minutes: 4
        run: swift test --package-path Packages/KulaCore --filter NativeChat --triple arm64-apple-macosx14.0
